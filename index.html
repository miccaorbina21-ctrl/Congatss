<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Congratulations, Maeryniel Icasiano Orbina, LPT!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Poppins:wght@300;400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --gold: #f5b914;
    --gold-light: #ffd95a;
    --gold-dark: #b8860b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); }
  body {
    font-family: "Poppins", system-ui, sans-serif;
    color: var(--gold);
    overflow-x: hidden;
  }

  .banner {
    position: relative;
    min-height: 100vh;
    display: grid;
    grid-template-columns: minmax(0, 32%) minmax(0, 68%);
    align-items: end;
    padding: 12vw 3vw 4vw;
    overflow: hidden;
  }

  /* gold glitter corners */
  .banner::before, .banner::after {
    content: "";
    position: absolute;
    top: 0;
    width: 28%;
    height: 45%;
    pointer-events: none;
    background-image:
      radial-gradient(circle, var(--gold) 1px, transparent 1.6px),
      radial-gradient(circle, var(--gold-dark) 1px, transparent 1.6px),
      radial-gradient(circle, var(--gold-light) 0.8px, transparent 1.4px);
    background-size: 9px 9px, 13px 13px, 7px 7px;
    background-position: 0 0, 4px 5px, 2px 3px;
    opacity: .7;
  }
  .banner::before {
    left: 0;
    -webkit-mask-image: radial-gradient(ellipse at 0% 0%, #000 20%, transparent 72%);
            mask-image: radial-gradient(ellipse at 0% 0%, #000 20%, transparent 72%);
  }
  .banner::after {
    right: 0;
    -webkit-mask-image: radial-gradient(ellipse at 100% 0%, #000 20%, transparent 72%);
            mask-image: radial-gradient(ellipse at 100% 0%, #000 20%, transparent 72%);
  }

  /* bunting */
  .bunting {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 11vw;
    z-index: 2;
  }

  .photo {
    position: relative;
    z-index: 1;
    align-self: end;
  }
  .photo img {
    display: block;
    width: 100%;
    height: auto;
    -webkit-mask-image: linear-gradient(to right, #000 88%, transparent);
            mask-image: linear-gradient(to right, #000 88%, transparent);
  }

  .text {
    position: relative;
    z-index: 1;
    padding-left: 3vw;
    text-align: center;
    align-self: center;
  }
  .congrats {
    font-family: "Kaushan Script", cursive;
    font-size: clamp(3rem, 10.5vw, 11rem);
    line-height: 1;
    color: var(--gold);
    transform: rotate(-3deg);
    text-shadow: 0 0 30px rgba(245, 185, 20, .25);
  }
  .name {
    font-weight: 800;
    font-size: clamp(1.4rem, 5.2vw, 5.6rem);
    line-height: 1.1;
    margin-top: .1em;
    letter-spacing: -.01em;
  }
  .tagline {
    font-weight: 300;
    font-size: clamp(.8rem, 2vw, 2rem);
    margin-top: 1.6em;
    letter-spacing: .02em;
  }

  /* single page-load moment: the heading writes itself in */
  @media (prefers-reduced-motion: no-preference) {
    .congrats { animation: reveal 1.4s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes reveal {
      from { clip-path: inset(0 100% 0 0); opacity: 0; }
      to   { clip-path: inset(0 0 0 0);   opacity: 1; }
    }
  }

  /* phones: stack */
  @media (max-width: 700px) {
    .banner {
      grid-template-columns: 1fr;
      padding: 24vw 6vw 8vw;
      gap: 6vw;
    }
    .photo { max-width: 320px; margin: 0 auto; order: 2; }
    .photo img { -webkit-mask-image: none; mask-image: none; }
    .text { padding-left: 0; order: 1; }
    .congrats { font-size: 17vw; }
    .name { font-size: 8vw; }
    .tagline { font-size: 4vw; }
    .bunting { height: 22vw; }
  }
</style>
</head>
<body>
  <main class="banner">

    <svg class="bunting" viewBox="0 0 2048 190" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffe27a"/>
          <stop offset=".5" stop-color="#f5b914"/>
          <stop offset="1" stop-color="#b8860b"/>
        </linearGradient>
        <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
          <circle cx="8" cy="8" r="3" fill="#fff" opacity=".85"/>
        </pattern>
      </defs>
      <path d="M0 40 Q1024 120 2048 40" fill="none" stroke="#777" stroke-width="3"/>
      <g id="flags"></g>
    </svg>

    <figure class="photo">
      <img src="photo.jpg" alt="Maeryniel Icasiano Orbina in graduation toga with light blue hood and medal">
    </figure>

    <section class="text">
      <h1 class="congrats">congratulations!</h1>
      <p class="name">MAERYNIEL ICASIANO<br>ORBINA, LPT</p>
      <p class="tagline">WE ARE SUPER DUPER PROUD OF YOU!</p>
    </section>
  </main>

<script>
  // Build the gold bunting flags along the curved string
  (function () {
    var g = document.getElementById("flags");
    var NS = "http://www.w3.org/2000/svg";
    var count = 21, w = 80, h = 105;
    for (var i = 0; i < count; i++) {
      var t = (i + 0.5) / count;
      var x = t * 2048;
      // point on quadratic curve y(t) from (0,40) ctrl (1024,120) to (2048,40)
      var y = (1 - t) * (1 - t) * 40 + 2 * (1 - t) * t * 120 + t * t * 40;
      var slope = 2 * (1 - t) * (120 - 40) + 2 * t * (40 - 120);
      var angle = Math.atan2(slope, 2048) * 180 / Math.PI;

      var grp = document.createElementNS(NS, "g");
      grp.setAttribute("transform", "translate(" + x + " " + y + ") rotate(" + angle + ")");

      var flag = document.createElementNS(NS, "path");
      flag.setAttribute("d", "M" + (-w / 2) + " 0 H" + (w / 2) + " V" + h + " L0 " + (h - 28) + " L" + (-w / 2) + " " + h + " Z");
      flag.setAttribute("fill", "url(#g)");
      grp.appendChild(flag);

      if (i % 3 === 1) {
        var dots = document.createElementNS(NS, "path");
        dots.setAttribute("d", "M" + (-w / 2 + 6) + " 8 H" + (w / 2 - 6) + " V" + (h - 22) + " L0 " + (h - 38) + " L" + (-w / 2 + 6) + " " + (h - 22) + " Z");
        dots.setAttribute("fill", "url(#dots)");
        grp.appendChild(dots);
      }
      g.appendChild(grp);
    }
  })();
</script>
</body>
</html>
